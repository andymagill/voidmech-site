name: CI

# Checks only. Deploys are done by Cloudflare Workers Builds (the GitHub
# integration) with its default Deploy and Preview commands; its Build command
# is `npm run build:cloudflare`. See README "Deploys".

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build config has no placeholders or Turnstile test keys
        run: npm run check:config

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Worker types are current
        run: |
          cp .dev.vars.example .dev.vars
          npx wrangler types
          git diff --ignore-cr-at-eol --exit-code worker-configuration.d.ts

      - name: Build
        run: npm run build

      # Runs the built Worker in local workerd, so failures that only happen
      # in the production bundle (not in dev or unit tests) block the deploy.
      - name: Smoke test the production build
        run: |
          npx wrangler d1 migrations apply voidmech-site --local
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          for page in / /download /roadmap; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:4173$page")
            echo "$page $status"
            [ "$status" = 200 ] || { cat preview.log; exit 1; }
          done
          node scripts/smoke-api.mjs http://localhost:4173 --local || { cat preview.log; exit 1; }

