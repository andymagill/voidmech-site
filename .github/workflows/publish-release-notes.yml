name: Publish release notes

# Publishes one game release's notes: the version's section of the game repo's
# CHANGELOG.md, at its tag, added here as content/releases/<version>.md through
# a pull request the job opens and squash-merges itself (main takes changes only
# through a pull request), then Workers Builds deploys main. The job runs here, not in the game
# repo, because the game repo is private and spends no Actions minutes (its
# D237); this repo is public, so its minutes are free. The game repo's
# tools/push-itch.ps1 starts it, or run it by hand (Actions > Publish release
# notes > Run workflow). Re-running a tag rewrites the same file, so it is safe.
# See docs/integrations/release-notes.md.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The game release tag, e.g. v0.1.0-alpha.1
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# Two releases published back to back push one after the other.
concurrency:
  group: publish-release-notes
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      # Only through the environment: an input is never pasted into a script.
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      # GAME_REPO_KEY is the private half of a read-only deploy key on the game
      # repo. Only CHANGELOG.md is checked out, at the tag itself.
      - name: Check out the game's CHANGELOG.md at the tag
        uses: actions/checkout@v4
        with:
          repository: andymagill/VoidMech
          ref: refs/tags/${{ env.TAG }}
          ssh-key: ${{ secrets.GAME_REPO_KEY }}
          persist-credentials: false
          path: game
          sparse-checkout: /CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Extract the changelog section
        run: node scripts/extract-release-notes.mjs game/CHANGELOG.md "$TAG" content/releases

      # A push made with GITHUB_TOKEN does not start CI, so the release files
      # are checked here, before the push that Workers Builds deploys.
      - name: Check the release files
        run: npx vitest run src/lib/releases.test.ts src/lib/extract-release-notes.test.ts

      # main takes changes only through a pull request (the Default ruleset, no
      # approvals or checks required), so the job opens one and merges it. It
      # needs Settings > Actions > General > "Allow GitHub Actions to create and
      # approve pull requests". A branch or PR left by a failed run is reused.
      - name: Merge into main through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/releases
          if git diff --cached --quiet; then
            echo "No change: the notes for $TAG are already published."
            exit 0
          fi
          branch="release-notes-$TAG"
          git switch -c "$branch"
          git commit -m "Release notes for $TAG"
          git push --force origin "HEAD:refs/heads/$branch"
          if [ "$(gh pr view "$branch" --json state --jq .state 2>/dev/null)" != OPEN ]; then
            gh pr create --base main --head "$branch" --title "Release notes for $TAG" --body "The game's CHANGELOG.md section for $TAG, by the Publish release notes workflow (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi
          # GitHub can take a moment to work out that a new PR is mergeable.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$branch" --squash; then
              git push origin --delete "$branch" || true
              exit 0
            fi
            sleep 5
          done
          echo "::error::Could not merge the release notes PR for $TAG; merge it by hand."
          exit 1
