name: CI and deploy

# Checks run on every push and pull request. Pushes to main also apply D1
# migrations and deploy the Worker, once the Cloudflare secrets exist
# (see README "First deploy"). Release files pushed by the game repo land on
# main, so they deploy the same way.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Worker types are current
        run: |
          cp .dev.vars.example .dev.vars
          npx wrangler types
          git diff --ignore-cr-at-eol --exit-code worker-configuration.d.ts

      - name: Build
        run: npm run build

      # Runs the built Worker in local workerd, so failures that only happen
      # in the production bundle (not in dev or unit tests) block the deploy.
      - name: Smoke test the production build
        run: |
          npx wrangler d1 migrations apply voidmech-site --local
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          for page in / /download /roadmap; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:4173$page")
            echo "$page $status"
            [ "$status" = 200 ] || { cat preview.log; exit 1; }
          done
          node scripts/smoke-api.mjs http://localhost:4173 --local || { cat preview.log; exit 1; }

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until Cloudflare is configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm

      - name: Refuse to deploy placeholders
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if grep -n "REPLACE_WITH_" wrangler.jsonc .env.production; then
            echo "::error::Fill in the placeholders above (README \"First deploy\") before deploying."
            exit 1
          fi

      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - name: Build
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run build

      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply voidmech-site --remote

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
