name: Announce release

# Opens one "Announce VoidMech <version>" issue per new release, once its page
# (/releases/<version>) is live, so it can go to Reddit and the itch.io devlog
# by hand in a minute: neither can be posted to by a bot (Reddit closed new
# Data API access on 31 October 2026; itch.io has no devlog API). The issue,
# written by scripts/release-announcement.mjs, has a Reddit submit link with
# the title and text filled in and an itch.io devlog draft to copy. A version
# that already has an issue (open or closed) is skipped, so a re-run is safe.
# Discord does have a webhook, so when the DISCORD_WEBHOOK_URL secret is set the
# notes are also posted there automatically (scripts/discord-announcement.mjs);
# the issue is then labelled discord-posted and gets a link to the message. An
# issue without that label is posted on a re-run, which is how an older release
# is backfilled. See docs/integrations/release-notes.md.
#
# Runs when:
# - the Publish release notes workflow merges a release that is new to main
#   (it calls this: its merge uses GITHUB_TOKEN, which starts no workflow);
# - a person merges a commit to main that adds a release file;
# - run by hand for any published version (Actions > Announce release).
#
# Defaults below; each can be overridden by a repository variable (Settings >
# Secrets and variables > Actions > Variables): REDDIT_SUBREDDIT, SITE_URL,
# ITCH_URL, ITCH_DEVLOG_URL, DISCORD_GUILD_ID.

on:
  push:
    branches: [main]
    paths: ['content/releases/*.md']
  workflow_call:
    inputs:
      version:
        description: The release version, e.g. 0.1.0-alpha.1
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: The release version (a content/releases file name, a leading v is fine), e.g. 0.1.0-alpha.1
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  announce:
    runs-on: ubuntu-latest
    # Job level, not workflow level, so it also applies when called.
    concurrency:
      group: announce-release
      cancel-in-progress: false
    env:
      # Inputs and event fields only through the environment, never pasted into a script.
      INPUT_VERSION: ${{ inputs.version }}
      BEFORE: ${{ github.event.before }}
      SITE_URL: ${{ vars.SITE_URL || 'https://voidmech.com' }}
      ITCH_URL: ${{ vars.ITCH_URL || 'https://ndxmii.itch.io/voidmech' }}
      SUBREDDIT: ${{ vars.REDDIT_SUBREDDIT || 'VoidMech' }}
      ITCH_DEVLOG_URL: ${{ vars.ITCH_DEVLOG_URL || 'https://itch.io/dashboard/game/5337597/new-devlog' }}
      # The webhook URL is a secret: anyone holding it can post to the channel. Unset skips Discord.
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      # Only for the message link in the issue comment.
      DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID || '1574606159124504638' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # A push is compared with the commit before it to find added files.
          fetch-depth: 0

      - name: Find the releases to announce
        id: find
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            versions="${INPUT_VERSION#v}"
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            versions=$(git diff --name-only --diff-filter=A "$BEFORE" "$GITHUB_SHA" -- 'content/releases/*.md' \
              | sed -E 's#^content/releases/(.+)\.md$#\1#')
          else
            echo "::warning::No previous commit to compare with; announce by hand if a release was added."
            versions=""
          fi

          checked=""
          for version in $versions; do
            # Same rule as src/lib/releases.ts; the version names a file and an issue.
            if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]{0,39}$ ]]; then
              echo "::error::'$version' is not a release version"
              exit 1
            fi
            if [ ! -f "content/releases/$version.md" ]; then
              echo "::error::content/releases/$version.md does not exist on main"
              exit 1
            fi
            checked="$checked $version"
          done
          checked="${checked# }"
          echo "versions=$checked" >> "$GITHUB_OUTPUT"
          echo "To announce: ${checked:-none}"

      - name: Announce the releases
        if: steps.find.outputs.versions != ''
        env:
          VERSIONS: ${{ steps.find.outputs.versions }}
        run: |
          gh label create release-announcement --color 22E0F0 \
            --description "Post a release's notes to Reddit and itch.io" 2>/dev/null || true
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            gh label create discord-posted --color 5865F2 \
              --description "The release's notes are posted to Discord" 2>/dev/null || true
          else
            echo "::notice::The DISCORD_WEBHOOK_URL secret is not set, so nothing is posted to Discord."
          fi

          for version in $VERSIONS; do
            title="Announce VoidMech $version"
            issue=$(gh issue list --state all --label release-announcement --limit 200 \
              --json number,title --jq ".[] | select(.title == \"$title\") | .number")
            # Discord is due when the webhook is set and the issue (if any) is not labelled discord-posted.
            discord=false
            if [ -n "$DISCORD_WEBHOOK_URL" ]; then
              discord=true
              if [ -n "$issue" ] && [ "$(gh issue view "$issue" --json labels \
                  --jq '[.labels[].name] | index("discord-posted") != null')" = true ]; then
                discord=false
              fi
            fi
            if [ -n "$issue" ] && [ "$discord" = false ]; then
              echo "Skipping $version: already announced in #$issue."
              continue
            fi

            # Workers Builds deploys main a minute or two after the merge; the
            # posts link the page, so wait until it is live (up to 15 minutes).
            url="$SITE_URL/releases/$version"
            for attempt in $(seq 1 45); do
              page_status=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              [ "$page_status" = 200 ] && break
              echo "$url is $page_status, waiting ($attempt/45)"
              sleep 20
            done
            if [ "$page_status" != 200 ]; then
              echo "::error::$url never came up (last status $page_status). Check the Workers Builds deploy, then re-run."
              exit 1
            fi

            if [ -z "$issue" ]; then
              node scripts/release-announcement.mjs "content/releases/$version.md" \
                --site "$SITE_URL" --itch "$ITCH_URL" \
                --subreddit "$SUBREDDIT" --itch-devlog "$ITCH_DEVLOG_URL" > announcement.md
              issue_url=$(gh issue create --title "$title" --body-file announcement.md \
                --label release-announcement --assignee "$GITHUB_REPOSITORY_OWNER")
              issue="${issue_url##*/}"
            fi

            # The issue comes first and the label last, so a failed post is
            # retried by a re-run and a successful one is never repeated.
            if [ "$discord" = true ]; then
              node scripts/discord-announcement.mjs "content/releases/$version.md" \
                --site "$SITE_URL" --itch "$ITCH_URL" > discord.json
              # wait=true makes Discord answer with the message, for its link.
              discord_status=$(curl -sS -o discord-response.json -w '%{http_code}' \
                -H 'Content-Type: application/json' --data-binary @discord.json \
                "$DISCORD_WEBHOOK_URL?wait=true" || true)
              if [ "$discord_status" != 200 ]; then
                echo "::error::Discord answered $discord_status: $(head -c 500 discord-response.json 2>/dev/null)"
                exit 1
              fi
              message=$(jq -r --arg guild "$DISCORD_GUILD_ID" \
                '"https://discord.com/channels/\($guild)/\(.channel_id)/\(.id)"' discord-response.json)
              gh issue edit "$issue" --add-label discord-posted
              gh issue comment "$issue" --body "Posted to Discord automatically: $message"
              echo "Posted $version to Discord: $message"
            fi
          done
